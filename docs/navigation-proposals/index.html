<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Melunga · Propositions de navigation</title>
  <link rel="stylesheet" href="../../melunga_deploy/maquette-guidee.css?v=26">
  <link rel="stylesheet" href="navigation-proposals.css">
</head>
<body class="np-review-page" data-ambience="dusk">
  <!-- Review controls belong outside the learner screen; capture=1 hides them. -->
  <header class="np-reviewbar" id="reviewControls">
    <div><strong>Trois présentations du menu</strong><span>Même leçon, trois dispositions à comparer.</span></div>
    <nav aria-label="Choisir une proposition" class="np-tabs">
      <button type="button" data-variant="1">1 · Une colonne</button>
      <button type="button" data-variant="2">2 · Deux groupes</button>
      <button type="button" data-variant="3">3 · En haut</button>
    </nav>
  </header>
  <div id="proposalStage"></div>
  <aside class="np-reviewnote" id="reviewNotes" aria-label="Explication de la proposition"><strong id="proposalName"></strong><p id="proposalNote"></p><small>Exemples visuels : aucune action ne change une leçon, un compte ou une préférence.</small></aside>
  <template id="learningArea">
    <main class="np-main">
      <div class="np-learning">
        <header class="np-theme-heading">
          <span class="np-theme-photo" role="img" aria-label="Deux personnes font connaissance"></span>
          <div><p class="np-overline">Premiers échanges</p><h1>Saluer et faire connaissance</h1></div>
        </header>
        <div class="np-level-progress" role="progressbar" aria-label="Progression du niveau 1" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25">
          <span class="np-progress-fill"></span><strong class="np-percent">25 %</strong><span class="np-end">Fin</span>
        </div>
        <section class="np-flashcard" aria-label="Phrase à pratiquer">
          <header class="np-card-top"><span class="np-card-theme">01</span><span class="np-card-position">4 / 29</span></header>
          <div class="np-card-body">
            <p class="np-study" lang="es">Me llamo María.</p>
            <div class="np-phonetic"><p>mé YA-mo ma-RI-a</p><button class="np-ear" type="button" aria-label="Écouter la phrase"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 22c-1-3-4-4-4-9a9 9 0 0 1 18 0c0 6-6 6-6 10a4 4 0 0 1-8 0"/><path d="M11 13a5 5 0 0 1 10 0c0 3-5 3-5 7m-4-7c0-2 3-3 4-1"/></svg></button></div>
            <p class="np-meaning">Je m’appelle Marie.</p>
            <button class="np-speaker" type="button" aria-label="Écouter la phrase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4V5Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
          </div>
        </section>
        <footer class="np-actions"><button class="np-action" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 9m-2-9h6M3 10V4"/></svg>À revoir</button><button class="np-action np-continue" type="button">Continuer<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button></footer>
      </div>
    </main>
  </template>
  <script>
  (() => {
    const svg = paths => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths+'</svg>';
    const icons = {
      home:svg('<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/>'),
      folder:svg('<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M3 11h18"/>'),
      recall:svg('<path d="M9 18h6m-6 3h6M8 14a7 7 0 1 1 8 0c-1 1-1 2-1 4H9c0-2 0-3-1-4Z"/>'),
      cap:svg('<path d="m2 9 10-5 10 5-10 5L2 9Zm4 2v6c4 3 8 3 12 0v-6m4-2v8"/>'),
      headphones:svg('<path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="12" width="5" height="9" rx="2"/><rect x="16" y="12" width="5" height="9" rx="2"/>'),
      info:svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>'),
      chat:svg('<path d="M21 11.5a8.4 8.4 0 0 1-9 8.2 10 10 0 0 1-4-.8L3 21l1.4-5.3A8.2 8.2 0 0 1 3 11.5a9 9 0 0 1 18 0Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/>'),
      person:svg('<circle cx="12" cy="7" r="3.3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>'),
      menu:svg('<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'),
      color:'<span class="mg-colorwheel np-colorwheel" aria-hidden="true"></span>',
      level:'<span class="np-level-letter">L1</span>',
      language:'<span class="np-spain" aria-hidden="true"></span>'
    };
    const learning = [{key:'home',label:'Accueil'}, {key:'folder',label:'Thèmes',active:true}, {key:'recall',label:'À revoir'}, {key:'cap',label:'Révisions'}];
    const settings = [{key:'headphones',label:'Voix'}, {key:'color',label:'Couleur'}, {key:'info',label:'Aide'}, {key:'chat',label:'Avis'}, {key:'person',label:'Mon compte'}];
    const selectors = [{key:'level',label:'Niveaux'}, {key:'language',label:'Espagnol'}];
    const descriptions = {
      1:{name:'1 · Une colonne régulière',note:'Toutes les commandes suivent le même alignement : une pastille, un libellé. Le repérage est immédiat et chaque rubrique reste visible.'},
      2:{name:'2 · Les actions d’apprentissage d’abord',note:'Les quatre actions pour apprendre sont réunies en haut. Les réglages restent accessibles en dessous, avec une présence plus discrète.'},
      3:{name:'3 · Une barre en haut',note:'Le logo et les actions essentielles occupent une seule barre. La carte prend toute la largeur disponible ; les autres commandes se trouvent dans Menu.'}
    };
    const pill = item => '<span class="np-pill np-pill-'+item.key+'">'+icons[item.key]+'</span>';
    const row = (item,secondary=false) => '<button type="button" class="np-navitem'+(item.active?' is-active':'')+(secondary?' is-secondary':'')+'"'+(item.active?' aria-current="page"':'')+'>'+pill(item)+'<span class="np-nav-label">'+item.label+'</span></button>';
    const brand = () => '<a class="np-brand" href="#" aria-label="Melunga"><img class="np-logo" src="../../melunga_deploy/melunga-logo.png" alt=""><span>Melunga</span></a>';
    const round = (item,menu=false) => '<button type="button" class="np-round" aria-label="'+item.label+'" title="'+item.label+'"'+(menu?' data-open-menu aria-haspopup="dialog" aria-expanded="false"':'')+'>'+pill(item)+'</button>';
    const mobileControls = () => '<div class="np-mobile-controls">'+round(selectors[0])+round(selectors[1])+round({key:'color',label:'Couleur'})+round({key:'menu',label:'Menu'},true)+'</div>';
    const group = (name,items,secondary=false) => '<section class="np-nav-group"><h2>'+name+'</h2><nav aria-label="'+name+'">'+items.map(item=>row(item,secondary)).join('')+'</nav></section>';
    const menu = () => '<div class="np-secondary-panel" hidden><h2>Menu</h2><nav aria-label="Autres rubriques">'+[learning[0],...settings].map(item=>row(item,true)).join('')+'</nav></div>';
    function render(variant) {
      const stage = document.getElementById('proposalStage');
      let navigation;
      if(variant===1) navigation='<aside class="np-sidebar">'+brand()+mobileControls()+'<nav class="np-unified" aria-label="Menu">'+selectors.map(item=>row(item)).join('')+'<span class="np-separator" aria-hidden="true"></span>'+[...learning,...settings].map(item=>row(item)).join('')+'</nav></aside>';
      else if(variant===2) navigation='<aside class="np-sidebar">'+brand()+mobileControls()+'<div class="np-selector-pair">'+selectors.map(item=>row(item,true)).join('')+'</div>'+group('Apprendre',learning)+group('Réglages',settings,true)+'</aside>';
      else navigation='<header class="np-topnav">'+brand()+'<nav class="np-header-primary" aria-label="Apprendre">'+learning.slice(1).map(item=>row(item)).join('')+'</nav><div class="np-header-controls">'+round(selectors[0])+round(selectors[1])+round({key:'menu',label:'Menu'},true)+'</div>'+mobileControls()+menu()+'</header>';
      stage.innerHTML='<section class="np-student np-layout-'+variant+'" aria-label="'+descriptions[variant].name+'">'+navigation+document.getElementById('learningArea').innerHTML+'<dialog class="np-mobile-drawer"><header><h2>Menu</h2><button type="button" data-close-menu aria-label="Fermer le menu">×</button></header><nav>'+[...selectors,...learning,...settings].map(item=>row(item)).join('')+'</nav></dialog></section>';
      const current = stage.querySelector('.np-student');
      current.querySelectorAll('[data-open-menu]').forEach(button=>button.addEventListener('click',()=>{
        const panel = current.querySelector('.np-secondary-panel');
        if(panel&&innerWidth>900){panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));}
        else{current.querySelector('.np-mobile-drawer').showModal();button.setAttribute('aria-expanded','true');}
      }));
      current.querySelector('[data-close-menu]').addEventListener('click',()=>current.querySelector('.np-mobile-drawer').close());
      current.querySelector('.np-mobile-drawer').addEventListener('close',()=>current.querySelectorAll('[data-open-menu]').forEach(button=>button.setAttribute('aria-expanded','false')));
      current.querySelector('.np-brand').addEventListener('click',event=>event.preventDefault());
      document.getElementById('proposalName').textContent=descriptions[variant].name;
      document.getElementById('proposalNote').textContent=descriptions[variant].note;
      document.querySelectorAll('[data-variant]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.variant)===variant)));
      const url=new URL(location.href);url.searchParams.set('variant',String(variant));history.replaceState(null,'',url);
      document.body.dataset.proposal=String(variant);
    }
    const query=new URL(location.href).searchParams;document.body.classList.toggle('is-capture',query.get('capture')==='1');
    document.querySelectorAll('[data-variant]').forEach(button=>button.addEventListener('click',()=>render(Number(button.dataset.variant))));
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){document.querySelectorAll('.np-secondary-panel').forEach(panel=>panel.hidden=true);document.querySelectorAll('[data-open-menu]').forEach(button=>button.setAttribute('aria-expanded','false'));}});
    const initial=Number(query.get('variant'));render([1,2,3].includes(initial)?initial:2);
  })();
  </script>
</body>
</html>
