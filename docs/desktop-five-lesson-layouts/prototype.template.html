<script>

const icons={folder:svg('<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M3 11h18"/>'),lamp:svg('<path d="M9 18h6m-6 3h6M8 14a7 7 0 1 1 8 0c-1 1-1 2-1 4H9c0-2 0-3-1-4Z"/>'),cap:svg('<path d="m2 9 10-5 10 5-10 5L2 9Zm4 2v6c4 3 8 3 12 0v-6m4-2v8"/>'),menu:svg('<rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="15" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/>'),arrow:svg('<path d="M4 12h16m-6-6 6 6-6 6"/>'),listen:svg('<path d="m11 4-6 5H2v6h3l6 5V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>'),review:svg('<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>'),info:svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>'),home:svg('<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/>'),ear:'<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 22c-1-3-4-4-4-9a9 9 0 0 1 18 0c0 6-6 6-6 10a4 4 0 0 1-8 0"/><path d="M11 13a5 5 0 0 1 10 0c0 3-5 3-5 7m-4-7c0-2 3-3 4-1"/></svg>'};

document.body.className='variant-'+variant;

 if(button.hasAttribute('data-close-menu')){document.getElementById('demoMenu').hidden=true;return;}
 if(button.dataset.action==='next'){
  position=(position+1)%samples.length;const [study,phonetic,native]=samples[position];document.querySelector('.study').textContent=study;document.querySelector('.phonetic strong').textContent=phonetic;document.querySelector('.translation').textContent=native;document.querySelector('.counter').textContent=(position+1)+' / 25';document.querySelector('.progress i').style.width=(position+1)/25*100+'%';return;
 }
 if(button.dataset.action==='review'){notify('Maquette : phrase placée dans « À revoir ».');return;}

 if(button.dataset.theme){document.querySelectorAll('[data-theme]').forEach(n=>{const active=n===button;n.classList.toggle('active',active);if(active)n.setAttribute('aria-current','true');else n.removeAttribute('aria-current');});notify('Maquette : aperçu du thème sélectionné.');return;}

});
