      document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));
      document.body.dataset.variant=variant;renderCard();
      const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);
    }
    function renderCard() {
      const card=cards[cardIndex], stage=document.getElementById('proposalStage');
      stage.querySelector('.nv-study').textContent=card.study;stage.querySelector('.nv-phonetic p').textContent=card.phon;stage.querySelector('.nv-meaning').textContent=card.native;
      stage.querySelector('.nv-position').textContent=(cardIndex+1)+' / '+cards.length;stage.querySelector('.nv-card').dataset.cardId=card.id;
    }
    document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>{variant=b.dataset.variant;render();}));
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){const menu=document.getElementById('secondaryMenu');if(menu)menu.hidden=true;document.querySelector('[data-open-menu]')?.setAttribute('aria-expanded','false');}});
    const query=new URL(location.href).searchParams;document.body.classList.toggle('is-capture',query.get('capture')==='1');variant=Object.hasOwn(versions,query.get('variant'))?query.get('variant'):'a';render();
  })();
  </script>
</body>
</html>
